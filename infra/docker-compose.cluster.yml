services:
  rabbit1:
    image: rabbitmq:3.13-management
    hostname: rabbit1
    container_name: pedidos360-rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Configure RABBITMQ_ERLANG_COOKIE in .env}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Configure RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Configure RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pedidos360_nodo1:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbit2:
    image: rabbitmq:3.13-management
    hostname: rabbit2
    container_name: pedidos360-rabbit2
    depends_on:
      rabbit1:
        condition: service_healthy
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Configure RABBITMQ_ERLANG_COOKIE in .env}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Configure RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Configure RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - pedidos360_nodo2:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pedidos360_nodo1:
  pedidos360_nodo2:
